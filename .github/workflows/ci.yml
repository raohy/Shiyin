name: 自动检查

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    name: macOS checks
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Swift 与 Xcode 环境
        run: |
          xcodebuild -version
          swift --version
      - name: 缓存 Swift 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ShiyinBuild/repositories
            ~/Library/Caches/ShiyinBuild/artifacts
            ~/Library/Caches/ShiyinBuild/checkouts
            ~/Library/Caches/ShiyinBuild-l10n/repositories
            ~/Library/Caches/ShiyinBuild-l10n/artifacts
            ~/Library/Caches/ShiyinBuild-l10n/checkouts
          key: checks-macos26-${{ hashFiles('Package.resolved') }}
      - name: 编译、回归测试与本地化
        run: bash scripts/ci/check-macos.sh
